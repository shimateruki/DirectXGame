<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Pop Fade Preview</title>
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(10, 18, 30, 0.82);
      --line: rgba(180, 225, 255, 0.28);
      --cyan: #65d8ff;
      --yellow: #ffe48a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: "Segoe UI", sans-serif;
      background: #08111d;
      color: white;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 70% 18%, rgba(255, 239, 185, 0.72), transparent 12%),
        radial-gradient(circle at 18% 72%, rgba(122, 213, 255, 0.28), transparent 18%),
        linear-gradient(#7eb9ea 0 45%, #5fa0d5 45% 100%);
    }

    .water {
      position: absolute;
      inset: 45% 0 0;
      background:
        repeating-linear-gradient(114deg, rgba(255, 255, 255, 0.14) 0 2px, transparent 2px 46px),
        linear-gradient(rgba(83, 165, 219, 0.86), rgba(43, 116, 174, 0.95));
      opacity: 0.88;
    }

    .platform {
      position: absolute;
      left: 16%;
      top: 48%;
      width: 68%;
      height: 19%;
      border-radius: 16px;
      transform: perspective(850px) rotateX(58deg) rotateZ(-8deg);
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.16), transparent 30%),
        #d7eed8;
      box-shadow: 0 36px 42px rgba(0, 31, 63, 0.22), inset 0 -18px 0 rgba(62, 93, 67, 0.22);
    }

    .platform::before,
    .platform::after {
      content: "";
      position: absolute;
      top: 28%;
      width: 18%;
      height: 36%;
      border-radius: 10px;
      background: #eef7f0;
      box-shadow: inset 0 -12px 0 rgba(68, 91, 71, 0.22);
    }

    .platform::before {
      left: -13%;
    }

    .platform::after {
      right: -13%;
    }

    .slime {
      position: absolute;
      left: 47%;
      top: 45%;
      width: 86px;
      height: 58px;
      border-radius: 50% 50% 44% 44% / 62% 62% 38% 38%;
      background:
        radial-gradient(circle at 33% 29%, rgba(255, 255, 255, 0.98) 0 5px, transparent 7px),
        radial-gradient(circle at 37% 48%, #0d498c 0 5px, transparent 6px),
        radial-gradient(circle at 63% 48%, #0d498c 0 5px, transparent 6px),
        radial-gradient(circle at 42% 18%, rgba(255, 255, 255, 0.7), transparent 18%),
        linear-gradient(#44d6ff, #198fc4);
      box-shadow: 0 16px 24px rgba(0, 50, 86, 0.28);
      animation: hop 1.7s ease-in-out infinite;
    }

    @keyframes hop {
      0%, 100% { transform: translateY(0) scale(1.04, 0.96); }
      45% { transform: translateY(-18px) scale(0.94, 1.08); }
    }

    .coin {
      position: absolute;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 24%, rgba(255, 255, 255, 0.96), transparent 18%),
        linear-gradient(135deg, #fff08a, #f4af20);
      box-shadow: 0 0 18px rgba(255, 221, 95, 0.72);
      animation: spin 1.2s linear infinite;
    }

    .coin.one { left: 34%; top: 37%; }
    .coin.two { left: 62%; top: 40%; animation-delay: -0.35s; }

    @keyframes spin {
      0%, 100% { transform: scaleX(1); }
      50% { transform: scaleX(0.25); }
    }

    .fade-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      image-rendering: auto;
    }

    .hud {
      position: absolute;
      left: 24px;
      top: 24px;
      display: grid;
      gap: 8px;
      font-weight: 800;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.42);
    }

    .hud span {
      display: inline-grid;
      grid-template-columns: 34px auto;
      gap: 8px;
      align-items: center;
      font-size: 26px;
    }

    .hud .dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #39d5ff;
      box-shadow: 0 0 14px rgba(72, 214, 255, 0.72);
    }

    .hud .star {
      width: 30px;
      height: 30px;
      clip-path: polygon(50% 0, 62% 35%, 99% 35%, 69% 56%, 80% 94%, 50% 70%, 20% 94%, 31% 56%, 1% 35%, 38% 35%);
      background: #ffe35f;
      box-shadow: 0 0 14px rgba(255, 228, 95, 0.72);
    }

    .controls {
      position: absolute;
      left: 50%;
      bottom: 20px;
      width: min(940px, calc(100vw - 40px));
      transform: translateX(-50%);
      display: grid;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button,
    select,
    input[type="range"] {
      accent-color: var(--cyan);
    }

    button,
    select {
      min-height: 34px;
      border: 1px solid rgba(164, 221, 255, 0.35);
      border-radius: 9px;
      background: rgba(75, 119, 148, 0.55);
      color: white;
      font-weight: 700;
      padding: 6px 12px;
    }

    button.primary {
      border-color: rgba(255, 228, 138, 0.72);
      background: rgba(220, 167, 58, 0.48);
    }

    label {
      color: rgba(235, 247, 255, 0.86);
      font-size: 14px;
      font-weight: 700;
    }

    input[type="range"] {
      flex: 1 1 360px;
      min-width: 240px;
    }

    .readout {
      min-width: 92px;
      color: var(--yellow);
      font-variant-numeric: tabular-nums;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="water"></div>
    <div class="platform"></div>
    <div class="coin one"></div>
    <div class="coin two"></div>
    <div class="slime"></div>
    <div class="hud">
      <span><i class="dot"></i>x 3</span>
      <span><i class="star"></i>x 5</span>
    </div>
    <img id="fadeFrame" class="fade-frame" alt="fade frame">

    <section class="controls">
      <div class="row">
        <button id="playOut" class="primary">Play Out</button>
        <button id="playIn">Play In</button>
        <button id="pause">Pause</button>
        <label for="sequence">Sequence</label>
        <select id="sequence">
          <option value="slime_wipe">Slime Pop Wipe</option>
          <option value="crown_iris">Slime Crown Iris</option>
        </select>
        <label for="fps">FPS</label>
        <select id="fps">
          <option>12</option>
          <option selected>18</option>
          <option>24</option>
          <option>30</option>
        </select>
      </div>
      <div class="row">
        <input id="frameSlider" type="range" min="0" max="23" value="0">
        <span id="readout" class="readout">00 / 23</span>
      </div>
    </section>
  </main>

  <script>
    const assetVersion = "slime-crown-20260615";
    const frameCount = 24;
    const frame = document.getElementById("fadeFrame");
    const slider = document.getElementById("frameSlider");
    const sequence = document.getElementById("sequence");
    const fpsSelect = document.getElementById("fps");
    const readout = document.getElementById("readout");
    let index = 0;
    let direction = 1;
    let playing = true;
    let lastStep = 0;

    function framePath(seq, i) {
      return `../Resources/sprite/fade/${seq}/frame_${String(i).padStart(2, "0")}.png?v=${assetVersion}`;
    }

    function setFrame(i) {
      index = Math.max(0, Math.min(frameCount - 1, i));
      frame.src = framePath(sequence.value, index);
      slider.value = String(index);
      readout.textContent = `${String(index).padStart(2, "0")} / ${frameCount - 1}`;
    }

    function animate(time) {
      const fps = Number(fpsSelect.value) || 18;
      if (playing && time - lastStep >= 1000 / fps) {
        lastStep = time;
        const next = index + direction;
        if (next < 0 || next >= frameCount) {
          playing = false;
        } else {
          setFrame(next);
        }
      }
      requestAnimationFrame(animate);
    }

    document.getElementById("playOut").addEventListener("click", () => {
      direction = 1;
      playing = true;
      setFrame(0);
    });

    document.getElementById("playIn").addEventListener("click", () => {
      direction = -1;
      playing = true;
      setFrame(frameCount - 1);
    });

    document.getElementById("pause").addEventListener("click", () => {
      playing = !playing;
    });

    slider.addEventListener("input", () => {
      playing = false;
      setFrame(Number(slider.value));
    });

    sequence.addEventListener("change", () => setFrame(index));

    setFrame(0);
    requestAnimationFrame(animate);
  </script>
</body>
</html>
